server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  quartz:
    job-store-type: memory
    auto-startup: false
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.threadPool.threadCount: 4
      org.quartz.jobStore.misfireThreshold: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  seed: ${SEED_DEMO_JOBS:true}
